name: Test Specifications

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repos
        uses: actions/checkout@v7

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12"

      - name: Update and build dependencies
        run: |
          cabal update
          cabal build impli-test

      - name: Run tests
        run: |
          set -o pipefail
          if ! cabal test impli-test 2>&1 | tee test.log; then
            grep -B2 -A8 -E 'FAIL|Failed|expected' test.log | head -40 | tr '\n' '~' | head -c 3000 > test-excerpt.txt || true
            echo "::error title=test-excerpt::$(cat test-excerpt.txt)"
            exit 1
          fi
