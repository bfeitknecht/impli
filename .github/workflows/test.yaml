name: Test Specifications

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repos
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12"

      - name: Update and build dependencies
        run: |
          cabal update
          set -o pipefail
          cabal build impli-test 2>&1 | tee build.log || {
            tail -n 80 build.log | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Run tests
        run: cabal test impli-test
