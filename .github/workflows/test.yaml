name: Test Specifications

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repos
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12"

      - name: Update and build dependencies
        run: |
          cabal update
          set -o pipefail
          cabal build --enable-tests impli-test 2>&1 | tee build.log || {
            msg=$(grep -B4 -A30 -m2 -E 'error:|Error|rejecting|conflict' build.log | head -n 80)
            msg="${msg//%%/%%25}"
            msg="${msg//$'\n'/%%0A}"
            msg="${msg//$'\r'/%%0D}"
            printf '::error::%s\n' "$msg"
            exit 1
          }

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          cabal test impli-test 2>&1 | tee test.log || {
            msg=$(grep -B4 -A30 -m2 -E 'error:|Error|FAIL|Failed' test.log | head -n 80)
            msg="${msg//%/%25}"
            msg="${msg//$'\n'/%0A}"
            msg="${msg//$'\r'/%0D}"
            printf '::error::%s\n' "$msg"
            exit 1
          }
