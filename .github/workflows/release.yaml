name: Release Binaries

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: auto
          - os: windows-latest
            arch: x86_64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12"

      - name: Cache Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cabal

      - name: Build impli
        run: |
          cabal update
          cabal build exe:impli

      - name: Prepare native binaries
        shell: bash
        run: |
          mkdir -p artifacts

          # Platform detection
          if [[ "${{ matrix.arch }}" == "auto" ]]; then
            ARCH=$(uname -m)
            # Normalize architecture name
            if [[ "$ARCH" == "arm64" ]]; then
              ARCH="aarch64"
            elif [[ "$ARCH" == "x86_64" || "$ARCH" == "amd64" ]]; then
              ARCH="x86_64"
            fi
          else
            ARCH="${{ matrix.arch }}"
          fi

          # Normalize OS name
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OS="windows"
            EXT=".exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            OS="darwin"
            EXT=""
          else
            OS="linux"
            EXT=""
          fi

          SYSTEM="${ARCH}-${OS}"

          # Use cabal list-bin to locate the binary
          BIN=$(cabal list-bin exe:impli)

          if [[ -z "$BIN" || ! -f "$BIN" ]]; then
            echo "ERROR: Could not find compiled binary"
            exit 1
          fi

          # Copy and rename with platform suffix
          cp "$BIN" "artifacts/impli-${SYSTEM}${EXT}"

          # Make it executable and strip on Unix
          if [[ "$OS" != "windows" ]]; then
            chmod +x "artifacts/impli-${SYSTEM}${EXT}"
            strip "artifacts/impli-${SYSTEM}${EXT}" 2>/dev/null || true
          fi

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: impli-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build WASM binary
        run: |
          set -o pipefail
          if ! nix build .#impli-web 2>&1 | tee wasm-build.log; then
            DRV=$(grep -oE '/nix/store/[a-z0-9]+-[^ ]*\.drv' wasm-build.log | tail -1)
            echo "::error title=nix-build-failed::drv=$DRV"
            if [ -n "$DRV" ]; then
              nix log "$DRV" 2>&1 > wasm-full.log || true
              LINE=$(grep -n ': error' wasm-full.log | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                START=$((LINE > 12 ? LINE - 12 : 1))
                sed -n "${START},$((LINE + 40))p" wasm-full.log > wasm-log-tail.txt
              else
                tail -70 wasm-full.log > wasm-log-tail.txt
              fi
              echo "::notice title=nix-log-probe::lines=$(wc -l < wasm-log-tail.txt)"
              tr '\n' '~' < wasm-log-tail.txt | sed 's/::/;/g' | head -c 3000 > wasm-log-tail-clean.txt || true
              echo "::error title=nix-log-tail::$(cat wasm-log-tail-clean.txt)"
            fi
            exit 1
          fi

      - name: Upload WASM build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: impli-wasm-log
          path: wasm-build.log
          if-no-files-found: ignore

      - name: Upload WASM binary
        uses: actions/upload-artifact@v7
        with:
          name: impli-wasm
          path: result/bin/impli.wasm

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-wasm]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy all binaries (native and WASM)
          find artifacts/impli-* -type f -exec cp {} release/ \;

          # List release files
          echo "Release files ready:"
          ls -lh release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
