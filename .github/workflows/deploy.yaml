name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build impli web REPL (WASM binary and JS artifacts)
        run: |
          set -o pipefail
          if ! nix run .#build 2>&1 | tee web-build.log; then
            DRV=$(grep -oE '/nix/store/[a-z0-9]+-impli-wasm32-wasi-[^ ]*\.drv' web-build.log | tail -1)
            echo "::error title=nix-run-failed::drv=$DRV"
            if [ -n "$DRV" ]; then
              nix log "$DRV" 2>&1 | tail -70 | tr '\n' '~' | head -c 3400 > nix-log-tail.txt || true
              echo "::error title=nix-log-tail::$(cat nix-log-tail.txt)"
            fi
            exit 1
          fi

      - name: Upload web build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: impli-web-build-log
          path: web-build.log
          if-no-files-found: ignore

      - name: Copy paper to server
        run: |
          ls -la docs/paper/ web/public/ | tee paper-copy.log
          cp -v docs/paper/IMP.pdf web/public/ 2>&1 | tee -a paper-copy.log

      - name: Upload paper copy log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paper-copy-log
          path: paper-copy.log
          if-no-files-found: ignore

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "web/public"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
