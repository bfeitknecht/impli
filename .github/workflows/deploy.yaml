name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build impli web REPL (WASM binary and JS artifacts)
        run: |
          nix run .#build 2>&1 | tee web-build.log || true
          TAIL=$(tail -8 web-build.log | tr '\n' '~')
          echo "::notice title=build-tail::$TAIL"
          echo "::notice title=after-build::pwd=$(pwd) web=$(ls -d web 2>&1) public=$(ls web/public 2>&1 | tr '\n' '|')"

      - name: Upload web build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: impli-web-build-log
          path: web-build.log
          if-no-files-found: ignore

      - name: Copy paper to server
        run: |
          ls -la docs/paper/ web/public/ | tee paper-copy.log
          cp -v docs/paper/IMP.pdf web/public/ 2>&1 | tee -a paper-copy.log

      - name: Upload paper copy log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paper-copy-log
          path: paper-copy.log
          if-no-files-found: ignore

      - name: Diagnose pages artifact archival
        if: always()
        run: |
          echo "::notice title=diag-ls::public: $(ls web/public 2>&1 | tr '\n' '|') temp=$(ls $RUNNER_TEMP 2>&1 | head -c 120 | tr '\n' '|')"
          if tar --dereference --hard-dereference --directory "web/public" -cf "$RUNNER_TEMP/manual.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' . 2>tar-err.log; then
            echo "::notice title=diag-tar::manual tar ok, size $(stat -c%s $RUNNER_TEMP/manual.tar)"
          else
            echo "::error title=diag-tar::manual tar failed rc=$? err=$(head -c 400 tar-err.log | tr '\n' '~')"
          fi
          FREE=$(df -m "$RUNNER_TEMP" | tail -1 | awk '{print $4}')
          echo "::notice title=diag-disk::temp free MB=$FREE"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "web/public"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
