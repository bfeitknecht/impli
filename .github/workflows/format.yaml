name: Test Formatting

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Haskell formatting
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.19.0.1"

      - name: Install Nix
        if: always()
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Annotate fourmolu diff on failure
        if: failure()
        run: |
          nix run nixpkgs#fourmolu -- --mode diff $(git ls-files '*.hs') 2>/dev/null | tr '\n' '~' | head -c 12000 > fourmolu-diff.txt || true
          echo "::error title=fourmolu-diff::$(cat fourmolu-diff.txt)"

      - name: Check Nix formatting
        run: |
          nix fmt -- --ci .
