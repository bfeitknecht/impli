name: Test Formatting

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Haskell formatting
        id: format
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.19.0.1"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Annotate fourmolu diff on fourmolu failure
        if: always() && steps.format.outcome == 'failure'
        run: |
          curl -sSL -o fourmolu https://github.com/fourmolu/fourmolu/releases/download/v0.19.0.1/fourmolu-0.19.0.1-linux-x86_64
          chmod +x fourmolu
          ./fourmolu --mode diff $(git ls-files '*.hs') | tr '\n' '~' > fourmolu-diff.txt || true
          if [ -s fourmolu-diff.txt ]; then
            split -b 1400 fourmolu-diff.txt fourmolu-chunk- || true
            for chunk in fourmolu-chunk-*; do
              echo "::error title=fourmolu-diff::$(cat $chunk)"
            done
          else
            echo "::error title=fourmolu-diff::(empty diff)"
          fi

      - name: Check Nix formatting
        run: |
          nix fmt -- --ci .
